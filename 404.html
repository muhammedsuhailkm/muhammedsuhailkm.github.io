<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Muhammed Suhail</title>
    <link rel="icon" href="/assets/img/favicon.ico?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" />
    <style>
      :root {
        --bg: #f3f0f1; --ink: #1c1318; --muted: #6b5d64; --line: #d9d0d4;
        --accent: #8a1538; --accent-strong: #6f0f2c; --on-accent: #fdf6f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #150e11; --ink: #f2eaed; --muted: #ab9aa2; --line: #35272e;
          --accent: #e8668d; --accent-strong: #f08aa8; --on-accent: #1a0a10;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; align-items: center;
        background: var(--bg); color: var(--ink);
        font: 1.0625rem/1.6 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        padding: 48px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px));
      }
      main { width: 100%; max-width: 1120px; margin-inline: auto; }
      .mono { font: 0.8125rem/1.6 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
      .mono b { color: var(--accent); font-weight: 500; }
      h1 {
        margin: 12px 0 0; color: var(--accent);
        font: 800 clamp(4.5rem, 20vw, 12rem)/0.9 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.04em;
      }
      p.lead { margin: 20px 0 28px; max-width: 30em; color: var(--muted); font-size: 1.1875rem; }
      a.btn {
        display: inline-block; padding: 13px 20px; border-radius: 6px;
        background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 500;
      }
      a.btn:hover { background: var(--accent-strong); }
      a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="mono">GET <span id="path">/this-page</span> → <b>404 Not Found</b></p>
      <h1>404</h1>
      <p class="lead">This route doesn't exist. The link may be old, or the address has a typo.</p>
      <a class="btn" href="/">Go to the home page →</a>
    </main>
    <script>
      document.getElementById("path").textContent = location.pathname;
    </script>
  </body>
</html>
